name: Build GTA VI Cinematic TikTok

on:
  push:
    paths:
      - "scripts/build_video.py"
      - ".github/workflows/gta6-cinematic.yml"
  workflow_dispatch:
    inputs:
      extra_source_urls:
        description: "Optional direct HTTPS MP4/MOV/M4V/WebM links to your gameplay or licensed stock clips (one per line)"
        required: false
        type: string
        default: ""

concurrency:
  group: cinemahub-gta6-render
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install portable FFmpeg
        run: |
          python3 -m pip install --user --disable-pip-version-check imageio-ffmpeg matplotlib
          mkdir -p "$HOME/.local/bin"
          FFMPEG_BIN="$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          ln -sf "$FFMPEG_BIN" "$HOME/.local/bin/ffmpeg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          FONT_FILE="$(python3 -c 'from matplotlib import font_manager; print(font_manager.findfont("DejaVu Sans:style=Bold"))')"
          echo "FONT_FILE=$FONT_FILE" >> "$GITHUB_ENV"
          ffmpeg -version | head -n 1
      - name: Validate Python
        run: python3 -m py_compile scripts/build_video.py
      - name: Render new cinematic GTA VI montage
        env:
          EXTRA_SOURCE_URLS: ${{ inputs.extra_source_urls }}
        run: python3 scripts/build_video.py
      - name: Verify output format and duration
        run: |
          python3 - <<'PY'
          import re, subprocess
          p = subprocess.run(["ffmpeg", "-hide_banner", "-i", "output/cinemahub-gta6.mp4", "-t", "0.001", "-f", "null", "-"], capture_output=True, text=True)
          log = p.stderr
          assert "Video: h264" in log, log
          assert "1080x1920" in log, log
          assert re.search(r"\b30 fps\b", log) or re.search(r"\b30 tbr\b", log), log
          m = re.search(r"Duration:\s*(\d+):(\d+):([\d.]+)", log)
          assert m, log
          h, minute, second = m.groups()
          duration = int(h)*3600 + int(minute)*60 + float(second)
          assert 22.0 <= duration <= 23.0, duration
          print(f"Verified H.264 1080x1920 30fps, {duration:.2f}s")
          PY
          test -s output/cover.jpg
          test -s output/publication-pack.txt
      - name: Upload finished video package
        uses: actions/upload-artifact@v4
        with:
          name: cinemahub-gta6-cinematic-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

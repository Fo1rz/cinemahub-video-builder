name: Build GTA VI Cinematic TikTok

on:
  push:
    paths:
      - "scripts/build_video.py"
      - ".github/workflows/gta6-cinematic.yml"
  workflow_dispatch:
    inputs:
      extra_source_urls:
        description: "Optional direct HTTPS MP4/MOV/M4V/WebM links to your gameplay or licensed stock clips (one per line)"
        required: false
        type: string
        default: ""

concurrency:
  group: cinemahub-gta6-render
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg and fonts are available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=2
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
      - name: Validate Python
        run: python3 -m py_compile scripts/build_video.py
      - name: Render new cinematic GTA VI montage
        env:
          EXTRA_SOURCE_URLS: ${{ inputs.extra_source_urls }}
        run: python3 scripts/build_video.py
      - name: Verify output format and duration
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 output/cinemahub-gta6.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/cinemahub-gta6.mp4
          test -s output/cover.jpg
          test -s output/publication-pack.txt
      - name: Upload finished video package
        uses: actions/upload-artifact@v4
        with:
          name: cinemahub-gta6-cinematic-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

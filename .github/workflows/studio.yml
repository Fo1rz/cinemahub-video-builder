name: CinemaHub Studio

on:
  push:
    paths:
      - "scripts/studio_build.py"
      - ".github/workflows/studio.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "Project title"
        required: true
        default: "GTA 6 — лучшие моменты из моих записей"
        type: string
      category:
        description: "Content category"
        required: true
        default: games
        type: choice
        options: [games, movies, series, trailers]
      drive_folder_url:
        description: "Shared Google Drive folder URL (anyone with the link: Viewer)"
        required: false
        default: "https://drive.google.com/drive/folders/1xo44fqdcea1AW1q-3Gcd7Ox4B5mF-2Ru"
        type: string
      source_urls:
        description: "Optional direct HTTPS links to permitted MP4/MOV/M4V/WebM files, one per line"
        required: false
        type: string
      hashtags:
        description: "TikTok hashtags"
        required: false
        default: "#CinemaHub #Gaming #Movies"
        type: string
      description:
        description: "Post description"
        required: false
        default: ""
        type: string
      music_url:
        description: "Optional direct HTTPS audio URL that you have rights to use"
        required: false
        type: string
      hook_text:
        description: "Optional opening hook shown on screen for the first 2.8 seconds (max 120 characters)"
        required: false
        type: string
      narration_text:
        description: "Optional Russian voiceover script (leave blank for no narration; max 2000 characters)"
        required: false
        type: string
      voice:
        description: "Narrator voice"
        required: true
        default: "ru-RU-DmitryNeural"
        type: choice
        options: ["ru-RU-DmitryNeural", "ru-RU-SvetlanaNeural"]
      pace:
        description: "Montage rhythm: fast (1.6s cuts), balanced (2.4s), cinematic (3.6s)"
        required: true
        default: "fast"
        type: choice
        options: ["fast", "balanced", "cinematic"]
      duration:
        description: "Video duration in seconds"
        required: true
        default: "22"
        type: choice
        options: ["15", "22", "30", "45", "60"]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Run full synthetic video build
        env:
          CINEMAHUB_SELF_TEST: "1"
          PROJECT_TITLE: "CinemaHub automated test"
          CATEGORY: games
          DURATION: "15"
          PACE: fast
        run: python3 scripts/studio_build.py
      - name: Upload self-test render for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cinemahub-self-test-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 3

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/studio_build.py

  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/studio_build.py
      - name: Install FFmpeg and Google Drive downloader
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --user --break-system-packages gdown
          ffmpeg -version | head -n 1
      - name: Install free text-to-speech dependency
        if: ${{ inputs.narration_text != '' }}
        run: python3 -m pip install --user --break-system-packages edge-tts
      - name: Build vertical TikTok video and creator pack
        env:
          PROJECT_TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          SOURCE_URLS: ${{ inputs.source_urls }}
          DRIVE_FOLDER_URL: ${{ inputs.drive_folder_url }}
          HASHTAGS: ${{ inputs.hashtags }}
          DESCRIPTION: ${{ inputs.description }}
          MUSIC_URL: ${{ inputs.music_url }}
          HOOK_TEXT: ${{ inputs.hook_text }}
          NARRATION_TEXT: ${{ inputs.narration_text }}
          VOICE: ${{ inputs.voice }}
          DURATION: ${{ inputs.duration }}
          PACE: ${{ inputs.pace }}
        run: python3 scripts/studio_build.py
      - name: Upload finished studio package
        uses: actions/upload-artifact@v4
        with:
          name: cinemahub-studio-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

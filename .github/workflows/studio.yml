name: CinemaHub Studio

on:
  push:
    paths:
      - "scripts/studio_build.py"
      - ".github/workflows/studio.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "Project title"
        required: true
        type: string
      category:
        description: "Content category"
        required: true
        type: choice
        options: [games, movies, series, trailers]
      source_urls:
        description: "Direct HTTPS links to permitted MP4/MOV/M4V/WebM files, one per line"
        required: true
        type: string
      hashtags:
        description: "TikTok hashtags"
        required: false
        default: "#CinemaHub #Gaming #Movies"
        type: string
      description:
        description: "Post description"
        required: false
        default: ""
        type: string
      music_url:
        description: "Optional direct HTTPS audio URL that you have rights to use"
        required: false
        type: string
      narration_text:
        description: "Optional Russian voiceover script (leave blank for no narration)"
        required: false
        type: string
      voice:
        description: "Narrator voice"
        required: true
        default: "ru-RU-DmitryNeural"
        type: choice
        options: ["ru-RU-DmitryNeural", "ru-RU-SvetlanaNeural"]
      duration:
        description: "Video duration in seconds"
        required: true
        default: "22"
        type: choice
        options: ["15", "22", "30", "45", "60"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/studio_build.py

  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/studio_build.py
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Install free text-to-speech dependency
        if: ${{ inputs.narration_text != '' }}
        run: python3 -m pip install --user --break-system-packages edge-tts
      - name: Build vertical TikTok video and creator pack
        env:
          PROJECT_TITLE: ${{ inputs.title }}
          CATEGORY: ${{ inputs.category }}
          SOURCE_URLS: ${{ inputs.source_urls }}
          HASHTAGS: ${{ inputs.hashtags }}
          DESCRIPTION: ${{ inputs.description }}
          MUSIC_URL: ${{ inputs.music_url }}
          NARRATION_TEXT: ${{ inputs.narration_text }}
          VOICE: ${{ inputs.voice }}
          DURATION: ${{ inputs.duration }}
        run: python3 scripts/studio_build.py
      - name: Upload finished studio package
        uses: actions/upload-artifact@v4
        with:
          name: cinemahub-studio-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 14
